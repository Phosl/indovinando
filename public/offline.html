<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Indovinando — Offline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: #fafafa;
            color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 24px;
            text-align: center;
            gap: 16px;
        }

        img {
            width: 100px;
            height: auto;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 900;
        }

        p {
            color: #666;
            font-size: 0.95rem;
            max-width: 280px;
            line-height: 1.5;
        }

        button {
            margin-top: 8px;
            padding: 12px 28px;
            border-radius: 12px;
            background: #833bac;
            color: #fff;
            font-size: 1rem;
            font-weight: 800;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <img src="/app_icon/apple-touch-icon.png" alt="Indovinando" />
    <h1>Sei offline 🍷</h1>
    <p>Controlla la connessione e riprova. Il Corso Vino potrebbe essere disponibile se l'hai già visitato.</p>
    <button onclick="location.reload()">Riprova</button>
</body>

</html>
